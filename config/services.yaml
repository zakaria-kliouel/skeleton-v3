# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    public_dir: '%kernel.project_dir%/public'
    open_api_file_resources:
        definitions: '%kernel.project_dir%/resources/templates/yaml/openApi/definitions.yaml'
        readSchema: '%kernel.project_dir%/resources/templates/yaml/openApi/schemas/read.yaml'
        writeSchema: '%kernel.project_dir%/resources/templates/yaml/openApi/schemas/write.yaml'
        indexResource: '%kernel.project_dir%/resources/templates/yaml/openApi/resources/_index.yaml'
        idResource: '%kernel.project_dir%/resources/templates/yaml/openApi/resources/{id}.yaml'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $publicPath: '%public_dir%'
            array $openApiFileResources: '%open_api_file_resources%'

    _instanceof:
        App\Generator\GeneratorInterface:
            tags: { name: 'app.generator', default_priority_method: getPriority }
    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Executor\BuildEntityExecutor:
        arguments:
            - !tagged_iterator app.generator

    App\Generator\EntityGenerator:
        arguments:
            - '@maker.generator'

    Symfony\Component\String\Inflector\EnglishInflector: ~
