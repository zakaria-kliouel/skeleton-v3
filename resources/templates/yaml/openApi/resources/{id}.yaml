get:
  operationId: api_{{entities}}_id_get
  tags:
    - {{Entity}}
  responses:
    200:
      description: '{{Entity}} resource'
      content:
        application/ld+json:
          schema:
            $ref: '../../definitions.yaml#/components/schemas/{{Entity}}.jsonld.read'
        application/json:
          schema:
            $ref: '../../definitions.yaml#/components/schemas/{{Entity}}.read'
    401:
      $ref: '../../definitions.yaml#/components/responses/401'
    403:
      $ref: '../../definitions.yaml#/components/responses/403'
    404:
      $ref: '../../definitions.yaml#/components/responses/404'
  summary: 'Retrieves a {{Entity}} resource.'
  description: 'Retrieves a {{Entity}} resource.'
  parameters:
    - name: {{identifier}}
      in: path
      description: '{{Entity}} identifier'
      required: true
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
      style: simple
      explode: false
      allowReserved: false
  deprecated: false

patch:
  operationId: api_{{entities}}_id_patch
  tags:
    - {{Entity}}
  responses:
    200:
      description: '{{Entity}} resource updated'
      content:
        application/ld+json:
          schema:
            $ref: '../../definitions.yaml#/components/schemas/{{Entity}}.jsonld.read'
        application/json:
          schema:
            $ref: '../../definitions.yaml#/components/schemas/{{Entity}}.read'
        multipart/form-data:
          schema:
            $ref: '../../definitions.yaml#/components/schemas/{{Entity}}.read'
      links: {  }
    400:
      $ref: '../../definitions.yaml#/components/responses/400'
    422:
      $ref: '../../definitions.yaml#/components/responses/422'
    404:
      $ref: '../../definitions.yaml#/components/responses/404'
  summary: 'Updates the {{Entity}} resource.'
  description: 'Updates the {{Entity}} resource.'
  parameters:
    - name: {{identifier}}
      in: path
      description: '{{Entity}} identifier'
      required: true
      deprecated: false
      allowEmptyValue: false
      schema:
        type: string
      style: simple
      explode: false
      allowReserved: false
  requestBody:
    description: 'The updated {{Entity}} resource'
    content:
      application/json:
        schema:
          $ref: '../../definitions.yaml#/components/schemas/{{Entity}}.write'
      multipart/form-data:
        schema:
          $ref: '../../definitions.yaml#/components/schemas/{{Entity}}.write'
    required: true
  deprecated: false
